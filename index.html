<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>水哥牌計算機</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; marginTop: 50px; }
        input, select, button { padding: 10px; margin: 5px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>水哥牌計算機</h1>
    <p>水哥是gay</p>
    
    <input type="number" id="num1" placeholder="請輸入一個數字"><br>
    <select id="op">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select><br>
    <input type="number" id="num2" placeholder="請輸入另一個數字"><br>
    <button onclick="cal()">開始計算</button>
    
    <h3>計算結果為：<span id="result"></span></h3>

    <script>
        function cal() {
            let a = parseFloat(document.getElementById('num1').value);
            let b = parseFloat(document.getElementById('num2').value);
            let op = document.getElementById('op').value;
            let res = 0;
            if (op == "+") res = a + b;
            else if (op == "-") res = a - b;
            else if (op == "*") res = a * b;
            else if (op == "/") res = b !== 0 ? a / b : "除數不能為0";
            document.getElementById('result').innerText = res;
        }
    </script>
</body>
</html>
